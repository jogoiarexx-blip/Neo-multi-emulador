name: Apply NEO Multi v0.1.8
on:
  push:
    branches: [main]
    paths:
      - '.github/patch-parts/**'
      - '.github/workflows/apply-v018.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.1.8 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patch-parts/part-* > /tmp/neo_v018.patch.gz.b64
          base64 -d /tmp/neo_v018.patch.gz.b64 > /tmp/neo_v018.patch.gz
          gzip -dc /tmp/neo_v018.patch.gz > /tmp/neo_v018.patch
          patch -p1 < /tmp/neo_v018.patch
          rm -rf .github/patch-parts
          rm -f .github/workflows/apply-v018.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Release NEO Multi v0.1.8"
          git push
